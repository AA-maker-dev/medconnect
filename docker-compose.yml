version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medconnect
      POSTGRES_PASSWORD: medconnect_pw
      POSTGRES_DB: medconnect
    ports:
      - '5432:5432'
    volumes:
      - medconnect_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medconnect']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medconnect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://medconnect:medconnect_pw@postgres:5432/medconnect?schema=public
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medconnect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  medconnect_pg_data:
